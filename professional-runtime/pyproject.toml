[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-professional-runtime"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.4", "temporalio==1.34.0"]

[project.optional-dependencies]
harness = ["deepseek-harness-sdk==0.2.1rc2", "deepseek-harness-runtime-bin==0.2.1rc2"]

[tool.setuptools.packages.find]
where = ["src"]
