[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-model-gateway"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["openai==3.24.0", "medical-contracts==1.0.0"]

[tool.setuptools]
script-files = ["task_gateway_entrypoint.py", "plan_draft_gateway_entrypoint.py", "section_writer_gateway_entrypoint.py", "document_review_gateway_entrypoint.py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medical_model_gateway = ["simulation-execution.schema.json", "provider-response-capture.schema.json", "runtime-step.schema.json"]
