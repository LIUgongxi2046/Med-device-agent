<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统账户管理 · 医疗器械资料平台</title><link rel="stylesheet" href="/local-auth/auth.css"><script src="/local-auth/management.js" type="module"></script></head>
<body><main class="management"><p class="brand">医疗器械资料平台</p><h1>系统账户管理</h1><a href="/local-auth/account.html">返回本人账户</a><p>平台管理员维护独立登录账户。企业成员和项目权限通过各自授权流程维护。</p><p role="status" aria-live="polite" data-management-status>正在读取系统账户</p><section data-accounts></section><button type="button" data-next hidden>读取后续账户</button><form data-create><h2>创建获授权人员账户</h2><label>真实用户名<input name="username" maxlength="128" autocomplete="off" required></label><label>显示名称<input name="display_name" maxlength="128" required></label><label>初始密码<input name="password" type="password" autocomplete="new-password" minlength="15" required></label><label>平台角色<select name="platform_role"><option value="USER">普通用户</option><option value="PLATFORM_ADMIN">平台管理员</option></select></label><p>密码至少15个字符，UTF-8编码最多72个字节。请通过获授权方式交付凭据。</p><button type="submit">确认创建账户</button><button type="button" data-abandon-create>清除待提交请求</button></form></main></body></html>
