<body><main><p class="brand">医疗器械资料平台</p><h1>当前账户</h1><dl><dt>显示名称</dt><dd data-name></dd><dt>用户名</dt><dd data-username></dd><dt>平台角色</dt><dd data-role></dd><dt>登录方式</dt><dd data-mode></dd><dt>账户身份</dt><dd data-identity></dd></dl><p>成员邀请使用经过认证的账户身份，企业及项目权限需要分别授权。</p><a href="/local-auth/enterprise-context.html">选择企业空间</a><a href="/local-auth/enterprise-roles.html">管理企业岗位</a><a href="/local-auth/management.html" data-management hidden>管理系统账户</a><a href="/local-auth/enterprise-registration.html" data-enterprise-registration hidden>企业登记申请</a><form data-credential><h2>变更本人密码</h2><label>当前密码<input name="current_password" type="password" autocomplete="current-password" required minlength="15"></label><label>新密码<input name="password" type="password" autocomplete="new-password" required minlength="15"></label><label>确认新密码<input name="confirmation" type="password" autocomplete="new-password" required minlength="15"></label><p>密码至少15个字符，UTF-8编码最多72个字节。成功以后需要使用新密码重新登录，请自行保存凭据。</p><button type="submit" disabled>确认变更本人密码</button><button type="button" data-abandon>清除待提交请求</button></form><button data-logout disabled>退出登录</button><p role="status" aria-live="polite" data-status>正在读取账户</p></main></body></html>
