openapi: 3.1.0
info:
  title: 医疗器械企业 Agent 页面和内部接口补充
  version: 1.0.0
  description: 新增 BX 操作、IA 操作及 DC/RV/RN 类型补充。既有其他接口继续由 LLD-后端维护。本制品为设计，服务运行 NOT_RUN。共同权限、幂等、时限、分页和业务约束见接口补充设计.md。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
security: [{Session: []}]
components:
  securitySchemes:
    Session: {type: apiKey, in: cookie, name: SESSION}
    TaskToken: {type: http, scheme: bearer}
    MutualTLS: {type: mutualTLS}
  parameters:
    Id: &id {name: id, in: path, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}
    Version: &version {name: X-Schema-Version, in: header, required: true, schema: {const: 1.0.0}}
    Context: &context {name: X-Context-Revision, in: header, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Revision'}}
    Idempotency: &idem {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[\x21-\x7e]+$'}}
    CSRF: &csrf {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 1}}
    Page: &page {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: &size {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Cursor: &cursor {name: cursor, in: query, schema: {type: string, minLength: 1}}
    Limit: &limit {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
    Project: &project {name: project_id, in: query, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}
    DocumentRevision: &docrev {name: document_revision, in: query, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}
    Status: &status {name: status, in: query, schema: {type: string, minLength: 1}, description: 仅接受目标资源在 LLD 中定义的状态枚举，其余值返回 422。}
    Watermark: &watermark {name: dataset_watermark, in: query, schema: {$ref: './interfaces.schema.yaml#/$defs/Revision'}}
    After: &after {name: after, in: query, schema: {type: string, minLength: 1}, description: after 与 Last-Event-ID 至少提供一个；同时提供时必须解析为相同流和序号。}
    LastEvent: &last {name: Last-Event-ID, in: header, schema: {type: string, minLength: 1}}
  responses:
    Error: &error {description: 当前权限、版本、输入、游标、限额或组件错误，HTTP 状态与语义见说明。, content: {application/json: {schema: {$ref: './interfaces.schema.yaml#/$defs/Error'}}}}
    Page: &records {description: 授权集合，detail 指向有固定 Schema 的完整资源产物。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: './interfaces.schema.yaml#/$defs/RecordPage'}}}]}}}}
    Record: &record {description: 固定资源，detail 的类型和当前授权按资源种类校验。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: './interfaces.schema.yaml#/$defs/Record'}}}]}}}}
    Operation: &operation {description: 已受理，终态通过 status_url 读取。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: './interfaces.schema.yaml#/$defs/Operation'}}}]}}}}
    SSE: &sse {description: 标准 SSE，每个 data 是完整 JSON；候选增量不携带 SSE id；逐帧授权。, content: {text/event-stream: {schema: {oneOf: [{$ref: './interfaces.schema.yaml#/$defs/PublicEvent'}, {$ref: './interfaces.schema.yaml#/$defs/CandidateDelta'}]}}}}
paths:
  /api/source-versions/{id}/exact-fields:
    post:
      operationId: approveSourceExactFields
      description: KN-EXACT-PUBLISH使用当前source.approve及来源/项目读取许可核准完整结构化字段；固定解析、索引、核准、权利及适用版本。expected_revision=0用于首次发布，后续使用当前字段修订。原文字段按Unicode位置核验；别名必须有人工审查理由。
      parameters: [*id, *version, *context, *idem, *csrf]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../business/medical-persistence/src/main/resources/source-exact.schema.json#/$defs/PublicationInput'}}}}
      responses:
        '201': {description: 保存后重读的完整核准清单、字段修订、原操作及当前上下文。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/source-exact.schema.json#/$defs/PublicationReceipt'}}}]}}}}
        default: *error
    get:
      operationId: readCurrentSourceExactFields
      description: 按明确来源、解析及核准身份读取当前字段清单；重新核查原文、当前位置及当前来源许可。
      parameters: [*id, *version, *context, {name: project_id, in: query, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}, {name: parse_version, in: query, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}, {name: approval_revision, in: query, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}]
      responses:
        '200': {description: 完整当前字段清单，resource_revision为字段发布修订。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/source-exact.schema.json#/$defs/Manifest'}}}]}}}}
        default: *error
  /api/source-versions/{id}/exact-fields/{revision}:
    get:
      operationId: readSourceExactFields
      parameters: [*id, *version, *context, {name: revision, in: path, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}, {name: project_id, in: query, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}]
      responses:
        '200': {description: 当前许可下的原固定字段清单，完整原值和位置保持。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/source-exact.schema.json#/$defs/Manifest'}}}]}}}}
        default: *error
  /api/retrievals/exact:
    post:
      operationId: createExactRetrieval
      description: KN-14-EXACT按明确字段对原值及人工核准别名执行等值查询；原文字节、大小写和空白保持。完整候选及结果超限直接拒绝；许可、原位置和完整清单复查后保存固定集合。
      parameters: [*version, *context, *idem, *csrf]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../business/medical-persistence/src/main/resources/source-exact.schema.json#/$defs/SearchInput'}}}}
      responses:
        '201': *operation
        default: *error
  /api/retrievals/exact/{id}:
    get:
      operationId: readExactRetrieval
      description: 仅原查询人员读取固定集合；每次分页核验全部命中、字段清单、数量和摘要，并重新核查全部当前来源、核准及适用许可。
      parameters: [*id, *version, *context, *page, *size]
      responses:
        '200': {description: 原查询、固定结果及全部匹配字段；空集合保持EMPTY。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/source-exact.schema.json#/$defs/Page'}}}]}}}}
        default: *error
  /api/source-versions/{id}/index-builds:
    get:
      operationId: readSourceIndexBuilds
      description: KN-INDEX-STATUS读取同项目完整全文构建、实际索引和投递状态、终态回执及失败原因；重新核查当前来源元数据及项目读取权限，超限拒绝完整响应。
      parameters: [*id, *version, *context, {name: project_id, in: query, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}]
      responses:
        '200': {description: 真实状态、预期和核验数量、原始时间及失败结果；不返回内部清单、对象位置或Worker身份。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/source-index-view.schema.json#/$defs/Listing'}}}]}}}}
        default: *error
  /api/uploads/{uploadId}/status:
    get:
      operationId: sourceUploadProcessingStatus
      description: KN-04读取本人原上传的实际接收、传输、KN-03操作与消费者结果，以及登记来源的解析、索引、核准、当前权利和原解析作业。重新检查原上传授权及来源读取许可；相同企业事务内核验完整原命令和回执。尚未产生的结果保持null；容量超过明确服务器限制时返回CONTEXT_LIMIT，原件对象地址不提供浏览器。
      parameters: [*version, *context, {name: uploadId, in: path, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}]
      responses:
        '200': {description: 实际逐阶段状态、原作业失败信息和固定来源，resource_revision表示原上传revision；来源门槛具有各自gate_revision。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/source-upload-status.schema.json#/$defs/View'}}}]}}}}
        default: *error
  /api/source-versions/{id}/rights-reviews:
    post:
      operationId: previewSourceRights
      description: 核查当前source.read、source.approve及适用project.read，返回固定来源、当前权利及人工决定的审查摘要。用途为SOURCE_RIGHTS_REVIEW。APPROVE必须明确完整用途、操作、提供方、区域、期限及实际授权Artifact；授权文件的Schema和读取范围由服务器配置。该查询不保存决定，缺少启用配置返回DEPENDENCY_UNAVAILABLE。
      parameters: [*id, *version, *context, *csrf]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../business/medical-persistence/src/main/resources/source-rights-decisions.schema.json#/$defs/PreviewInput'}}}}
      responses:
        '200': {description: 当前权利审查清单，resource_revision为source_rights_state的revision。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/source-rights-decisions.schema.json#/$defs/Preview'}}}]}}}}
        default: *error
  /api/source-versions/{id}/rights-decisions:
    post:
      operationId: decideSourceRights
      description: KN-RIGHTS-01保存人工APPROVE、RETURN或REVOKE。请求固定审查清单摘要、原权利身份及expected_revision；实际授权文件按固定S3版本读取并核验完整字节。新权利、状态CAS、原操作、审计、Outbox和回执同事务保存。相同原键及完整请求重读原结果，异参拒绝；批准不改变解析、索引或资料采用门槛。
      parameters: [*id, *version, *context, *idem, *csrf]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../business/medical-persistence/src/main/resources/source-rights-decisions.schema.json#/$defs/DecisionInput'}}}}
      responses:
        '200': {description: 已保存人工权利决定、固定权利版本及当前会话上下文。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/source-rights-decisions.schema.json#/$defs/Receipt'}}}]}}}}
        default: *error
  /api/scenarios:
    get:
      operationId: scenarioCatalogue
      description: CP-07查询当前企业中获授权的真实SCENARIO配置元数据，按configuration.read及项目读取许可过滤。规划要求独立返回，不计入配置版本数量。当前完整规格和发布准入尚未提供，task_entry保持null；文稿适用性查询返回DEPENDENCY_UNAVAILABLE。相同范围使用固定查询水位，下一页必须携带原水位。
      parameters:
        - *version
        - *context
        - *project
        - {name: document_type, in: query, schema: {$ref: '../business/medical-persistence/src/main/resources/templates.schema.json#/$defs/DocumentType'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after, in: query, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}
        - {name: dataset_watermark, in: query, schema: {$ref: './interfaces.schema.yaml#/$defs/Hash'}}
      responses:
        '200': {description: 当前配置版本、缺项及规划要求，resource_revision=null；未查询到获授权版本时items为空。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/scenario-catalogue.schema.json#/$defs/Page'}}}]}}}}
        default: *error
  /api/tasks:
    post:
      operationId: createTask
      description: TK-01在同一企业事务保存固定快照、任务版本、完整输入、缺项、原响应、审计和Outbox。C06发布准入消费者或原签发文稿继续修订的保存能力缺少时返回DEPENDENCY_UNAVAILABLE。相同键与原请求返回原201响应，异参返回IDEMPOTENCY_CONFLICT。
      parameters: [*version, *context, *idem, *csrf]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../business/medical-persistence/src/main/resources/tasks.schema.json#/$defs/Create'}}}}
      responses:
        '201': {description: 保存后的固定任务创建结果。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: './resource-details.schema.yaml#/$defs/TaskDetail'}}}]}}}}
        default: *error
  /api/projects/{projectId}/task-create-operations:
    get:
      operationId: originalTaskCreation
      description: 读取本人原TK-01操作。重新检查当前创建与任务读取许可，原来源使用TASK_CREATION历史读取；不存在返回200及data=null，已完成返回原201与固定TaskDetail。不得通过查询参数扩大范围。
      parameters: [*version, *context, *idem, {name: projectId, in: path, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}]
      responses:
        '200': {description: 当前本人及项目不存在该原操作。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {type: 'null'}}}]}}}}
        '201': {description: 原创建结果。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: './resource-details.schema.yaml#/$defs/TaskDetail'}}}]}}}}
        default: *error
  /api/projects/{projectId}/task-creation-owners:
    get:
      operationId: taskCreationOwners
      description: 查询当前企业中可承担新项目任务的有效成员。检查项目创建许可、ACTIVE项目、成员和有效身份，再核验项目任务读取许可的完整条件。有限候选页经过资格核验，空页仍可返回明确下一页游标；新任务保存时重新核验责任人员。
      parameters:
        - *version
        - *context
        - {name: projectId, in: path, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after, in: query, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}
        - {name: dataset_watermark, in: query, schema: {$ref: './interfaces.schema.yaml#/$defs/Hash'}}
      responses:
        '200': {description: 当前获授权责任人员及固定查询水位，resource_revision=null；继续查询必须提供原水位。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/task-creation-selection.schema.json#/$defs/Owners'}}}]}}}}
        default: *error
  /api/projects/{projectId}/task-creation-sources:
    get:
      operationId: taskCreationSources
      description: 查询当前项目获授权的正式固定资料版本，复用任务来源的权利、核准、解析、索引及项目适用性核验。查询水位包含完整当前授权集合和当前主体范围；新任务保存时重新检查完整来源。
      parameters:
        - *version
        - *context
        - {name: projectId, in: path, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after, in: query, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}
        - {name: dataset_watermark, in: query, schema: {$ref: './interfaces.schema.yaml#/$defs/Hash'}}
      responses:
        '200': {description: 当前正式资料集合，resource_revision=null；没有资料返回空集合。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/task-scope-selection.schema.json#/$defs/Page'}}}]}}}}
        default: *error
  /api/projects/{projectId}/task-creation-collections:
    get:
      operationId: taskCreationCollections
      description: 查询当前项目或企业获授权的固定资料集版本，核验完整成员和当前正式来源资格。有限查询使用当前依赖容量；下一页必须携带原查询水位，不自动采用更新版本或扩展成员范围。
      parameters:
        - *version
        - *context
        - {name: projectId, in: path, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after, in: query, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}
        - {name: dataset_watermark, in: query, schema: {$ref: './interfaces.schema.yaml#/$defs/Hash'}}
      responses:
        '200': {description: 当前固定资料集集合，resource_revision=null；没有资料集返回空集合。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/task-scope-selection.schema.json#/$defs/Page'}}}]}}}}
        default: *error
  /api/projects/{projectId}/task-create-drafts:
    post:
      operationId: saveTaskCreationDraft
      description: 保存本人完整Create输入，检查当前企业、项目创建许可及当前ACTIVE项目属性。同键同参返回原201，异参返回IDEMPOTENCY_CONFLICT。完整输入保存在本人操作记录，审计及Outbox只包含身份和摘要；不创建任务或授予发布资格。
      parameters: [*version, *context, *idem, *csrf, {name: projectId, in: path, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../business/medical-persistence/src/main/resources/tasks.schema.json#/$defs/Create'}}}}
      responses:
        '201': {description: 原输入草稿回执，resource_revision=null。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/task-create-draft.schema.json#/$defs/View'}}}]}}}}
        default: *error
    get:
      operationId: originalTaskCreationDraft
      description: 按原操作键读取本人完整输入草稿，重新检查当前企业及项目许可。不自动重试创建；不接受查询参数。
      parameters: [*version, *context, *idem, {name: projectId, in: path, required: true, schema: {$ref: './interfaces.schema.yaml#/$defs/Id'}}]
      responses:
        '200': {description: 当前本人及项目没有该输入草稿，data=null且resource_revision=null。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {type: 'null'}}}]}}}}
        '201': {description: 原输入草稿及原request_id，resource_revision=null。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/task-create-draft.schema.json#/$defs/View'}}}]}}}}
        default: *error
  /api/tasks/{id}/plan-decisions:
    post:
      operationId: TK-04
      description: RETURN保留原任务输入和计划；CONFIRM要求当前完整发布准入，保存新任务输入及确认计划。缺少发布准入消费者返回DEPENDENCY_UNAVAILABLE。
      parameters: [*id, *version, *context, *idem, *csrf]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../business/medical-persistence/src/main/resources/task-plan-decision.schema.json#/$defs/Request'}}}}
      responses:
        '200': {description: 已保存的人工确认或退回决定；原操作返回原回执。, content: {application/json: {schema: {allOf: [{$ref: './interfaces.schema.yaml#/$defs/Envelope'}, {properties: {data: {$ref: '../business/medical-persistence/src/main/resources/task-plan-decision.schema.json#/$defs/Receipt'}}}]}}}}
        default: *error
  /api/tasks/{id}/plan-decision-basis:
    get:
      operationId: TK-PLAN-DECISION-BASIS
      parameters: [*id, *version, *context, {name: X-Plan-Decision, in: header, required: false, schema: {type: string, enum: [RETURN, CONFIRM], default: RETURN}, description: 人工决定用途；确认依据核查完整当前准入。}]
      responses:
