openapi: 3.1.0
info:
  title: Fixed regulatory comparison scenario
  version: 1.0.0
  description: Independent B15 selection, not a new template document type. Uses an actual applicable template/document type and B14 review/publication. No legal approval is conferred by a machine result.
paths:
  /api/regulatory-comparisons/specifications:
    post:
      operationId: authorFixedRegulatoryComparison
      parameters:
        - {name: X-Schema-Version, in: header, required: true, schema: {const: 1.0.0}}
        - {name: X-Context-Revision, in: header, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, scenario, selection]
              properties:
                schema_version: {const: 1.0.0}
                scenario: {$ref: '../business/medical-persistence/src/main/resources/scenario-specification-v1.schema.json#/$defs/Author'}
                selection: {$ref: '#/components/schemas/Selection'}
      responses:
        '200': {description: B14 immutable author receipt. Not executable until independent review and genuine release publication.}
        '403': {description: Current project capability or source/dependency authority missing.}
        '409': {description: Context or idempotency conflict.}
        '422': {description: Invalid fixed selection, missing eight-field specification or evidence.}
  /api/regulatory-comparisons/tasks/{taskId}/runs/{runId}/results/{actionId}:
    get:
      operationId: readRegisteredRegulatoryComparison
      description: Reads registered N05 result provenance only after exact task, artifact and full scenario dependency authorization. Historical machine proposition, never current legal approval. Revoked source rights block reads. Results use typed RegulatoryComparisonPipeline.Result; each clause retains both exact EvidenceRefs and physical read receipt IDs.
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: actionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-Schema-Version, in: header, required: true, schema: {const: 1.0.0}}
        - {name: X-Context-Revision, in: header, required: true, schema: {type: string}}
      responses:
        '200': {description: Standard envelope with comparison, source refs, physical receipt IDs, UNKNOWN reasons and human_review_required=true.}
        '403': {description: Current task, artifact, configuration or source authority missing.}
        '409': {description: Context mismatch or immutable receipt/audit/event inconsistency.}
        '422': {description: Result not yet submitted or not a regulatory comparison.}
components:
  schemas:
    Basis:
      type: object
      additionalProperties: false
      required: [version_id, content_sha256]
      properties:
        version_id: {type: string, format: uuid}
        content_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    Edition:
      type: object
      additionalProperties: false
      required: [source, parse_version, approval_revision, rights_revision, law_identifier, edition, jurisdiction, effective_date]
      properties:
        source: {$ref: '#/components/schemas/Basis'}
        parse_version: {type: string, format: uuid}
        approval_revision: {type: string, format: uuid}
        rights_revision: {type: string, format: uuid}
        law_identifier: {type: string, minLength: 1, maxLength: 256}
        edition: {type: string, minLength: 1, maxLength: 256}
        jurisdiction: {type: string, minLength: 1, maxLength: 256}
        effective_date: {type: string, format: date}
    Selection:
      type: object
      additionalProperties: false
      required: [schema_version, scenario_kind, as_of_date, coverage_mode, baseline, target, clauses]
      properties:
        schema_version: {const: 1.0.0}
        scenario_kind: {const: REGULATION_COMPARISON}
        as_of_date: {type: string, format: date}
        coverage_mode: {const: SELECTED_CLAUSES}
        baseline: {$ref: '#/components/schemas/Edition'}
        target: {$ref: '#/components/schemas/Edition'}
        clauses:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [clause_key, baseline, target, applicability_rule]
            properties:
              clause_key: {type: string, minLength: 1, maxLength: 128}
              baseline:
                description: Nullable exact shared DatasetProtocol.EvidenceRef. Validated by the shared dataset schema, including typed locator. Must match the pinned baseline edition. Both sides cannot be null.
                type: [object, 'null']
              target:
                description: Nullable exact shared DatasetProtocol.EvidenceRef, matching the pinned target edition.
                type: [object, 'null']
              applicability_rule:
                anyOf:
                  - {$ref: '#/components/schemas/Basis'}
                  - {type: 'null'}
