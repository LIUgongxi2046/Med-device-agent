[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-document"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "medical-contracts==1.0.0",
  "pydantic==2.13.5",
  "docling==2.73.1",
  "docling-parse==4.7.2",
  "python-docx==1.2.0",
  "latex2mathml==3.81.1",
  "mathml2omml==0.0.2",
  "fonttools==4.60.2",
  "pypdf==6.9.2",
  "markdown-it-py==4.0.0",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "python-pptx==1.0.2",
  "defusedxml==0.7.1",
  "opencv-python==4.11.0.86",
  "numpy==1.26.4",
]

[tool.setuptools.packages.find]
where = ["src"]
