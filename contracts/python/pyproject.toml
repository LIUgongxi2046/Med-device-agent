[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-contracts"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["jsonschema[format]==4.26.0", "referencing==0.37.0", "PyYAML==6.0.3", "rfc8785==0.1.4", "pydantic==2.13.5"]

[project.optional-dependencies]
test = ["markdown-it-py==4.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
